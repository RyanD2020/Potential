command: ['streamlit', 'run', 'app.py']

# Serving-endpoint resources (no vendor API key needed - see
# providers/databricks_provider.py). Each one below must have a matching
# "Serving endpoint" app resource with the same resource key, or deployment
# will fail. If you stop using one, remove its entry here too.
env:
  - name: CLAUDE_SERVING_ENDPOINT
    valueFrom: claude-serving-endpoint
  - name: GEMINI_SERVING_ENDPOINT
    valueFrom: gemini-serving-endpoint
  - name: GPT_SERVING_ENDPOINT
    valueFrom: gpt-serving-endpoint
